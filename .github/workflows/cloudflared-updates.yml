name: Check cloudflared updates

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cloudflared-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for a new stable cloudflared release
        run: python3 scripts/update_cloudflared.py

      - name: Open or update a pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/update-cloudflared
          delete-branch: true
          commit-message: "chore: update cloudflared"
          title: "chore: update cloudflared to latest stable release"
          body: |
            Automated cloudflared release update.

            - Bumps the pinned binary version and official GitHub SHA-256 checksum
            - Bumps the Home Assistant app version so an update appears in Home Assistant
            - Updates the changelog

            Review and merge when ready. This does not deploy automatically.
          add-paths: |
            Dockerfile
            config.yaml
            CHANGELOG.md
